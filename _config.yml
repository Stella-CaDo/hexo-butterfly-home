# Public defaults. Private deployment overrides belong in _config.local.yml.
title: 我的博客
subtitle: 记录与分享
description: ''
keywords: null
author: 站点作者
language: zh-CN
timezone: Asia/Shanghai
url: https://example.com
permalink: ':year/:month/:day/:title/'
permalink_defaults: null
pretty_urls:
  trailing_index: true
  trailing_html: true
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render: []
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''
index_generator:
  path: blog
  per_page: 10
  order_by: '-date'
default_category: uncategorized
category_map: null
tag_map: null
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page
include: null
exclude: null
ignore: null
theme: butterfly
deploy:
  type: ''
search:
  path: search.xml
  field: post
  content: true
swiper:
  enable: true
  priority: 5
  enable_page: /blog/
  timemode: date
  layout:
    type: id
    name: recent-posts
    index: 0
  default_descr: 阅读文章
  swiper_css: /vendor/blog-slider/swiper.min.css?v=4.1.6
  swiper_js: /vendor/blog-slider/swiper.min.js?v=4.1.6
  custom_css: /vendor/blog-slider/swiperstyle.css?v=1.0.12
  custom_js: /vendor/blog-slider/swiper_init.js?v=1.0.12
wowjs:
  enable: false
  priority: 10
  mobile: false
  animateitem:
    - class: recent-post-item
      style: animate__zoomIn
      duration: 2s
      delay: 1s
      offset: 100
      iteration: 1
    - class: card-widget
      style: animate__zoomIn
  animate_css: https://npm.elemecdn.com/hexo-butterfly-wowjs/lib/animate.min.css
  wow_js: https://npm.elemecdn.com/hexo-butterfly-wowjs/lib/wow.min.js
  wow_init_js: https://npm.elemecdn.com/hexo-butterfly-wowjs/lib/wow_init.js
envelope_comment:
  enable: false
  custom_pic:
    cover: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/violet.jpg
    line: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/line.png
    beforeimg: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/before.png
    afterimg: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/after.png
  message:
    - 有什么想问的？
    - 有什么想说的？
    - 有什么想吐槽的？
    - 哪怕是有什么想吃的，都可以告诉我哦~
  bottom: 自动书记人偶竭诚为您服务！
  height: null
  path: null
  front_matter:
    title: 留言板
    comments: true
all_minifier: true
html_minifier:
  enable: true
  ignore_error: false
  exclude: null
css_minifier:
  enable: true
  exclude:
    - '*.min.css'
js_minifier:
  enable: true
  mangle: true
  output: null
  compress: null
  exclude:
    - '*.min.js'
    - js/search/*.js
image_minifier:
  enable: false
  interlaced: false
  multipass: false
  optimizationLevel: 2
  pngquant: false
  progressive: false
